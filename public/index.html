<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ペグブロック</title>
  <meta name="description" content="1列に並んだブロックを飛び越えて、最後の1個まで減らすステージ制パズル。">
  <meta name="theme-color" content="#7b2ff7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="logo"><span>ペ</span><span>グ</span><span>ブ</span><span>ロ</span><span>ッ</span><span>ク</span></h1>
      <div class="top-btns">
        <button class="icon-btn" id="btn-sound" type="button" aria-label="音のオン・オフ">🔊</button>
        <button class="icon-btn" id="btn-rules" type="button" aria-label="ルール">?</button>
      </div>
    </header>

    <section class="stage-bar" aria-label="ステージ">
      <div class="stage-name" id="stage-name">STAGE 1</div>
      <div class="goal" id="goal">ブロックを <b>1個</b> だけ残そう</div>
    </section>

    <section class="stats" aria-label="状況">
      <div class="stat stat-left"><span class="label">残り</span><span class="value" id="left">0</span></div>
      <div class="stat stat-moves"><span class="label">手数</span><span class="value" id="moves">0</span></div>
      <div class="stat stat-best"><span class="label">最短記録</span><span class="value" id="best">-</span></div>
    </section>

    <div class="board-area" id="area">
      <div class="board" id="board" aria-label="ゲーム盤"></div>
    </div>

    <nav class="controls">
      <button class="btn btn-new" id="btn-reset" type="button">↻ はじめから</button>
    </nav>
  </main>

  <dialog id="dlg-clear" class="dlg">
    <h2>ステージクリア！</h2>
    <p class="stage-title" id="clear-stage">STAGE 1</p>
    <dl class="result">
      <div><dt>手数</dt><dd id="c-moves">0</dd></div>
      <div><dt>最短記録</dt><dd id="c-best">0</dd></div>
    </dl>
    <p class="best-badge" id="c-badge" hidden>最短手数！パーフェクト</p>
    <div class="dlg-actions">
      <button class="btn btn-sub" id="clear-again" type="button">もう一度</button>
      <button class="btn btn-new" id="clear-next" type="button">次のステージ</button>
    </div>
  </dialog>

  <dialog id="dlg-stuck" class="dlg">
    <h2>動かせない…</h2>
    <p class="stuck-note">動かせるブロックがなくなりました。残りは <b id="s-left">0</b> 個です。</p>
    <div class="dlg-actions">
      <button class="btn btn-new" id="stuck-again" type="button">もう一度</button>
    </div>
  </dialog>

  <dialog id="dlg-rules" class="dlg">
    <h2>あそびかた</h2>
    <ol class="rules">
      <li>ブロックを<b>スワイプ</b>すると、その方向に隣り合うブロックを1つ飛び越えて、先の空きマスへ移動します。タップで選んでから移動先をタップしてもOK。</li>
      <li>飛び越えられたブロックは盤から取られます。</li>
      <li>ブロックを<b>1個だけ</b>残せたらステージクリア。動かせるブロックがなくなったら、はじめからやり直しです。</li>
    </ol>
    <div class="dlg-actions">
      <button class="btn btn-new" id="rules-close" type="button">はじめる</button>
    </div>
  </dialog>

  <script src="logic.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
