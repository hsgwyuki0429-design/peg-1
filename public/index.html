<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ブロックブロック</title>
  <meta name="description" content="ブロックを飛び越えて取っていく、十字盤のパズルゲーム。">
  <meta name="theme-color" content="#7b2ff7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="logo"><span>ペ</span><span>グ</span><span>ブ</span><span>ロ</span><span>ッ</span><span>ク</span></h1>
      <div class="top-btns">
        <button class="icon-btn" id="btn-sound" type="button" aria-label="音のオン・オフ">🔊</button>
        <button class="icon-btn" id="btn-rules" type="button" aria-label="ルール">?</button>
      </div>
    </header>

    <section class="stats" aria-label="スコア">
      <div class="stat stat-score"><span class="label">得点</span><span class="value" id="score">0</span></div>
      <div class="stat stat-best"><span class="label">ベスト</span><span class="value" id="best">0</span></div>
      <div class="stat stat-moves"><span class="label">残り</span><span class="value" id="left">0</span></div>

    </section>

    <div class="board-area">
      <div class="board-frame" id="frame">
        <div class="board" id="board" aria-label="ゲーム盤"></div>
      </div>
    </div>

    <nav class="controls">
      <button class="btn btn-new" id="btn-new" type="button">新しいゲーム</button>
    </nav>
  </main>

  <dialog id="dlg-over" class="dlg">
    <h2>積み！</h2>
    <p class="best-badge" id="best-badge" hidden>ベスト更新！</p>
    <dl class="result">
      <div><dt>得点</dt><dd id="r-score">0</dd></div>
      <div><dt>残りブロック</dt><dd id="r-left">0</dd></div>
    </dl>
    <div class="dlg-actions">
      <button class="btn btn-new" id="over-new" type="button">もう一度</button>
    </div>
  </dialog>

  <dialog id="dlg-rules" class="dlg">
    <h2>あそびかた</h2>
    <ol class="rules">
      <li>ブロックを<b>スワイプ</b>すると、その方向に隣り合うブロックを1つ飛び越えて、先の空きマスへ移動します。タップで選んでから移動先をタップしてもOK。</li>
      <li>飛び越えたブロックは盤から消えて、<b>1点</b>。斜めには動けません。</li>
      <li>どのブロックも動かせなくなったら終了です。取った数が多いほど高得点。</li>
    </ol>
    <div class="dlg-actions">
      <button class="btn btn-new" id="rules-close" type="button">はじめる</button>
    </div>
  </dialog>

  <script src="logic.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
